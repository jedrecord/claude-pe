# Forward auth headers for Anthropic model requests
general_settings:
  forward_llm_provider_auth_headers: true

model_list:
  # Routing opus to Anthropic directly for planning/orchestration
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: "https://api.anthropic.com"

  # Route the Sub-agent models to OpenRouter
  # These model names should match the model specified in the agents md file frontmatter
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: "https://openrouter.ai/api/v1"
  - model_name: claude-sonnet-5
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: "https://openrouter.ai/api/v1"
